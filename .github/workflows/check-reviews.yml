name: Check Hotel Reviews

on:
  schedule:
    # Every 6 hours. Both APIs meter calls, and the Terra allowance is the
    # binding constraint: at 4 runs a day a 100-call allowance lasts ~25 days,
    # where 2-hourly would have burnt it in 8. Well inside MAX_AGE_DAYS, so no
    # review can slip past the alert window between runs.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email'
        type: boolean
        default: false
      debug:
        description: 'Dump what the APIs return (no email, read-only)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run review checker
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python check_reviews.py --test
          elif [ "${{ inputs.debug }}" = "true" ]; then
            python check_reviews.py --debug
          else
            python check_reviews.py
          fi

      # Review history now lives in the repo rather than the Actions cache:
      # caches are evicted after 7 days unused, which would silently destroy
      # the history the dashboard and weekly digest are built on. Only real
      # runs mutate it; test and debug are read-only.
      #
      # !cancelled() is load-bearing. An `if:` without a status function has an
      # implicit success(), which would skip these steps whenever the checker
      # exits non-zero — and it exits non-zero whenever *either* feed fails.
      # History would then never persist while one API was down, so the healthy
      # platform's reviews would stay unseen and re-alert on every run.
      # --encrypt refuses to run without DASHBOARD_PASSWORD rather than quietly
      # publishing the dashboard in the clear.
      - name: Rebuild dashboard
        if: ${{ !cancelled() && inputs.test_email != true && inputs.debug != true }}
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python dashboard.py --encrypt

      - name: Commit review history and dashboard
        if: ${{ !cancelled() && inputs.test_email != true && inputs.debug != true }}
        run: |
          if [ -z "$(git status --porcelain reviews.json docs)" ]; then
            echo "No new reviews — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews.json docs
          git commit -m "Record new reviews and refresh dashboard"
          # The keepalive job also pushes to main; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push
