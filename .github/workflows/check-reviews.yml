name: Check Hotel Reviews

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email'
        type: boolean
        default: false
      debug:
        description: 'Dump what the APIs return (no email, read-only)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist "seen reviews" state via the Actions cache instead of committing
      # it back to the repo (which spammed main with a commit every 30 min).
      # The rotating run_id key means each run writes a fresh cache entry;
      # restore-keys falls back to the most recent prior one. On a cache miss
      # the seen_reviews.json committed in the repo acts as the seed, so state
      # is never lost — worst case the run re-uses the seed and re-initialises.
      - name: Restore review state
        uses: actions/cache/restore@v4
        with:
          path: seen_reviews.json
          key: seen-reviews-${{ github.run_id }}
          restore-keys: |
            seen-reviews-

      - name: Run review checker
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KE }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python check_reviews.py --test
          elif [ "${{ inputs.debug }}" = "true" ]; then
            python check_reviews.py --debug
          else
            python check_reviews.py
          fi

      # Only real runs mutate state; test/debug are read-only, so skip saving.
      - name: Save review state
        if: ${{ inputs.test_email != true && inputs.debug != true }}
        uses: actions/cache/save@v4
        with:
          path: seen_reviews.json
          key: seen-reviews-${{ github.run_id }}
